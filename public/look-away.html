<!DOCTYPE html>
<html lang="en" class="popup-panel-root">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self';">
    <title data-i18n="popup.lookAway.title">Look away</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/popup-glow.css">
    <link rel="stylesheet" href="css/look-away.css">
</head>
<body>
    <div class="look-away-container popup-glass popup-enter" id="container">
        <h2 class="look-away-title" id="look-away-title">Look away</h2>
        <div class="look-away-hint" id="look-away-hint">Focus on something ~20 feet / 6 m away</div>
        <div class="look-away-timer" role="status" aria-live="polite" aria-atomic="true">
            <div class="look-away-ring-wrap">
                <svg class="look-away-ring" viewBox="0 0 88 88" aria-hidden="true">
                    <circle class="look-away-ring-track" cx="44" cy="44" r="38"></circle>
                    <circle class="look-away-ring-progress" id="countdown-ring" cx="44" cy="44" r="38"></circle>
                </svg>
                <div class="look-away-countdown" id="countdown">20</div>
            </div>
            <div class="look-away-unit" data-i18n="popup.lookAway.unit">seconds</div>
        </div>
        <div class="look-away-buttons" hidden>
            <button class="look-away-button skip" type="button" data-i18n="popup.lookAway.skip">Skip</button>
            <button class="look-away-button snooze" type="button" data-i18n="popup.lookAway.snooze">Snooze (5 min)</button>
        </div>
    </div>
    <script src="js/shared/i18n.js"></script>
    <script src="js/shared/popup-a11y.js"></script>
    <script src="js/shared/theme.js"></script>
    <script src="js/look-away.js"></script>
</body>
</html>
