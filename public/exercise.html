<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self';">
    <title data-i18n="popup.exercise.title">Eye Exercise Time!</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/exercise.css">
</head>
<body>
    <div class="exercise-container popup-glass popup-enter" id="container">
        <h2 class="exercise-title" id="exercise-title" data-i18n="popup.exercise.title">Eye Exercise Time!</h2>
        <div class="exercise-text" id="exercise" role="status" aria-live="polite" aria-atomic="true"></div>
        <div class="exercise-buttons" hidden>
            <button class="exercise-button skip" type="button" data-i18n="popup.exercise.skip">Skip</button>
            <button class="exercise-button snooze" type="button" data-i18n="popup.exercise.snooze">Snooze (5 min)</button>
        </div>
    </div>
    <script src="js/shared/i18n.js"></script>
    <script src="js/shared/popup-a11y.js"></script>
    <script src="js/shared/theme.js"></script>
    <script src="js/exercise.js"></script>
</body>
</html>
