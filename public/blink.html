<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self';">
  <title data-i18n="popup.blink.title">Blink Reminder</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/popup-glow.css">
  <link rel="stylesheet" href="css/reminder.css">
</head>
<body>
  <div class="reminder-card" id="blink" data-kind="blink">
    <h2 id="blink-title" class="popup-sr-only" data-i18n="popup.blink.title">Blink Reminder</h2>
    <div class="reminder-stack">
      <div class="reminder-content">
        <div class="reminder-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </div>
        <div class="reminder-message" id="blink-message" role="status" aria-live="polite" aria-atomic="true">Blink!</div>
      </div>
      <button type="button" class="reminder-snooze" id="snooze-blink" hidden data-i18n="popup.blink.snooze">Snooze (5 min)</button>
    </div>
  </div>
  <script src="js/shared/i18n.js"></script>
  <script src="js/shared/popup-a11y.js"></script>
  <script src="js/shared/theme.js"></script>
  <script src="js/reminder.js"></script>
</body>
</html>
