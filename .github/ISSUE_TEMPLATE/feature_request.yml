name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Ideas and polish suggestions are welcome. For bugs, use the **Bug report** template instead.

        BlinkGuard stays local-first — see [PRIVACY.md](https://github.com/xpogx-org/BlinkGuard/blob/main/PRIVACY.md).

  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What pain point would this solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other tools you tried?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Reminders / timer
        - Camera / blink detection
        - Exercises / look-away
        - Progress / rewards
        - Settings / tray
        - Other
    validations:
      required: true
