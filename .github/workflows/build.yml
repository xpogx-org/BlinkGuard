name: Build and Release

on:
  # Single automatic trigger: publishing a GitHub Release (gh release create / UI).
  # Do not also listen for push tags — that doubles runs when tag + release are shipped together.
  # workflow_dispatch remains for manual attach/dry-run.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_to_tag:
        description: "Optional existing release tag to publish to (e.g. v2.0.0). Empty = package only."
        required: false
        default: ""
      platforms:
        description: "Which platform jobs to run"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - windows
          - macos

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-windows:
    if: >-
      (github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event.inputs.platforms == 'both' ||
      github.event.inputs.platforms == 'windows' ||
      github.event.inputs.platforms == ''
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.12'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download shape predictor model
        run: |
          Write-Host "Downloading shape predictor model..."
          $modelUrl = "https://github.com/davisking/dlib-models/raw/master/shape_predictor_68_face_landmarks.dat.bz2"
          $modelDir = "electron/assets/models"
          $modelPath = "$modelDir/shape_predictor_68_face_landmarks.dat"
          $archivePath = "$modelPath.bz2"

          New-Item -ItemType Directory -Force -Path $modelDir | Out-Null
          # curl retries mid-stream drops; Invoke-WebRequest often fails with ResponseEnded on runners.
          & curl.exe -L --fail --retry 5 --retry-delay 2 --retry-all-errors -o $archivePath $modelUrl
          if ($LASTEXITCODE -ne 0) {
            Write-Error "curl failed to download shape predictor (exit $LASTEXITCODE)"
            exit $LASTEXITCODE
          }
          $archiveSize = (Get-Item $archivePath).Length
          if ($archiveSize -lt 10MB) {
            Write-Error "Downloaded archive looks too small ($archiveSize bytes)"
            exit 1
          }

          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (Test-Path $sevenZip) {
            & $sevenZip e $archivePath "-o$modelDir" -y
            if ($LASTEXITCODE -ne 0) {
              Write-Host "7zip extract failed; falling back to Python..."
              python -c "import bz2, pathlib; src=pathlib.Path(r'$archivePath'); dst=pathlib.Path(r'$modelPath'); dst.write_bytes(bz2.decompress(src.read_bytes())); src.unlink()"
            } else {
              Remove-Item $archivePath -Force
            }
          } else {
            Write-Host "7zip not available, using Python to extract..."
            python -c "import bz2, pathlib; src=pathlib.Path(r'$archivePath'); dst=pathlib.Path(r'$modelPath'); dst.write_bytes(bz2.decompress(src.read_bytes())); src.unlink()"
          }

          if (!(Test-Path $modelPath)) {
            Write-Error "Shape predictor file not found after download"
            exit 1
          }
          Write-Host "Model size: $((Get-Item $modelPath).Length / 1MB) MB"

      - name: Cache pip wheels
        uses: actions/cache@v5
        with:
          path: |
            ~/AppData/Local/pip/Cache
            python/venv
          key: ${{ runner.os }}-pip-${{ hashFiles('python/requirements.txt') }}-${{ hashFiles('python/setup.bat') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ hashFiles('python/requirements.txt') }}-
            ${{ runner.os }}-pip-

      - name: Cache PyInstaller
        uses: actions/cache@v5
        with:
          path: |
            python/build/
            python/dist/
            ~/AppData/Local/pyinstaller
          key: ${{ runner.os }}-pyinstaller-${{ hashFiles('python/blink_detector.py', 'python/blink_detector.spec') }}
          restore-keys: |
            ${{ runner.os }}-pyinstaller-

      - name: Setup Python environment
        working-directory: python
        shell: cmd
        run: setup.bat

      - name: Build and install Python binary
        working-directory: python
        shell: cmd
        run: build_and_install.bat

      - name: Verify Python binary installed
        run: |
          if (!(Test-Path "electron/resources/blink_detector.exe")) {
            Write-Error "Binary not installed to electron/resources/blink_detector.exe"
            Get-ChildItem "electron/resources/" -ErrorAction SilentlyContinue
            exit 1
          }
          $BINARY_SIZE = (Get-Item "electron/resources/blink_detector.exe").Length
          Write-Host "Binary size: $BINARY_SIZE bytes ($([math]::Round($BINARY_SIZE / 1MB, 2))MB)"
          if ($BINARY_SIZE -lt 50000000) {
            Write-Error "Binary seems too small (less than 50MB)"
            exit 1
          }

      # Optional Windows code signing (scripts/publish-windows.js):
      #   CSC_LINK, CSC_KEY_PASSWORD — when unset, tag releases stay unsigned.
      - name: Build Windows app
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          $isTag = "${{ startsWith(github.ref, 'refs/tags/v') }}" -eq "true"
          $publishTag = "${{ github.event.inputs.publish_to_tag }}"
          if ($isTag -or (![string]::IsNullOrWhiteSpace($publishTag))) {
            if (![string]::IsNullOrWhiteSpace($publishTag)) {
              Write-Host "Manual publish to existing release tag: $publishTag"
            } else {
              Write-Host "Tag release build: publishing to GitHub Releases (latest.yml + Setup.exe + blockmap)"
            }
            npm run build:windows:publish
          } else {
            Write-Host "Branch build: package only (--publish never)"
            npm run build
          }

      - name: Verify Windows app artifacts
        run: |
          Write-Host "Verifying Windows app artifacts..."

          if (!(Test-Path "dist/BlinkGuard.Setup.exe")) {
            Write-Error "EXE file not found"
            Get-ChildItem "dist/" -ErrorAction SilentlyContinue
            exit 1
          }

          if (!(Test-Path "dist/BlinkGuard-x64.zip")) {
            Write-Error "ZIP file not found"
            Get-ChildItem "dist/" -ErrorAction SilentlyContinue
            exit 1
          }

          $expectUpdater = ("${{ startsWith(github.ref, 'refs/tags/v') }}" -eq "true") -or (-not [string]::IsNullOrWhiteSpace("${{ github.event.inputs.publish_to_tag }}"))
          if ($expectUpdater) {
            if (!(Test-Path "dist/latest.yml")) {
              Write-Error "latest.yml not found (required for electron-updater)"
              Get-ChildItem "dist/" -ErrorAction SilentlyContinue
              exit 1
            }
            $blockmaps = Get-ChildItem "dist/*.blockmap" -ErrorAction SilentlyContinue
            if (-not $blockmaps) {
              Write-Error "No .blockmap files found (required for electron-updater)"
              Get-ChildItem "dist/" -ErrorAction SilentlyContinue
              exit 1
            }
            Write-Host "OK: updater metadata present (latest.yml + blockmap)"
          }

          $EXE_SIZE = (Get-Item "dist/BlinkGuard.Setup.exe").Length
          $ZIP_SIZE = (Get-Item "dist/BlinkGuard-x64.zip").Length

          Write-Host "EXE size: $EXE_SIZE bytes ($([math]::Round($EXE_SIZE / 1MB, 2))MB)"
          Write-Host "ZIP size: $ZIP_SIZE bytes ($([math]::Round($ZIP_SIZE / 1MB, 2))MB)"

          if ($EXE_SIZE -lt 100000000) {
            Write-Error "EXE seems too small (less than 100MB). Build may have failed."
            exit 1
          }

          Write-Host "Windows app artifacts verification passed!"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v5
        with:
          name: BlinkGuard-Windows
          if-no-files-found: error
          path: |
            dist/BlinkGuard.Setup.exe
            dist/BlinkGuard-x64.zip

      - name: Upload updater metadata
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_to_tag != ''
        uses: actions/upload-artifact@v5
        with:
          name: BlinkGuard-Windows-updater
          path: |
            dist/latest.yml
            dist/*.blockmap

  build-macos:
    if: >-
      (github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event.inputs.platforms == 'both' ||
      github.event.inputs.platforms == 'macos' ||
      github.event.inputs.platforms == ''
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.12'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download shape predictor model
        run: |
          set -euo pipefail
          MODEL_DIR="electron/assets/models"
          MODEL_PATH="$MODEL_DIR/shape_predictor_68_face_landmarks.dat"
          MODEL_URL="https://github.com/davisking/dlib-models/raw/master/shape_predictor_68_face_landmarks.dat.bz2"
          mkdir -p "$MODEL_DIR"
          curl -L --fail --retry 5 --retry-delay 2 --retry-all-errors -o "$MODEL_PATH.bz2" "$MODEL_URL"
          python3 - <<'PY'
          import bz2, pathlib
          src = pathlib.Path("electron/assets/models/shape_predictor_68_face_landmarks.dat.bz2")
          dst = pathlib.Path("electron/assets/models/shape_predictor_68_face_landmarks.dat")
          dst.write_bytes(bz2.decompress(src.read_bytes()))
          src.unlink()
          print(f"Model size: {dst.stat().st_size / (1024 * 1024):.1f} MB")
          PY
          test -s "$MODEL_PATH"

      - name: Cache pip / venv
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/pip
            python/venv
          key: ${{ runner.os }}-pip-${{ hashFiles('python/requirements.txt') }}-${{ hashFiles('python/setup.sh') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ hashFiles('python/requirements.txt') }}-
            ${{ runner.os }}-pip-

      - name: Cache PyInstaller
        uses: actions/cache@v5
        with:
          path: |
            python/build/
            python/dist/
            ~/Library/Application Support/pyinstaller
          key: ${{ runner.os }}-pyinstaller-${{ hashFiles('python/blink_detector.py', 'python/blink_detector.spec') }}
          restore-keys: |
            ${{ runner.os }}-pyinstaller-

      - name: Setup Python environment
        working-directory: python
        run: |
          set -euo pipefail
          if [[ -d venv ]]; then
            # shellcheck disable=SC1091
            source venv/bin/activate
            if python -c "import cv2, numpy, dlib, PyInstaller" 2>/dev/null; then
              echo "OK: using cached virtual environment"
              exit 0
            fi
            deactivate || true
            rm -rf venv
          fi
          ./setup.sh

      - name: Build and install Python binary
        working-directory: python
        run: |
          set -euo pipefail
          ./build_and_install.sh
          test -x ../electron/resources/blink_detector
          BINARY_SIZE=$(stat -f%z ../electron/resources/blink_detector)
          echo "Binary size: $BINARY_SIZE bytes ($(( BINARY_SIZE / 1024 / 1024 )) MB)"
          if [[ "$BINARY_SIZE" -lt 50000000 ]]; then
            echo "Binary seems too small (<50MB)"
            exit 1
          fi

      # Optional macOS signing/notarize secrets (scripts/publish-mac.js):
      #   CSC_LINK / CSC_KEY_PASSWORD or CSC_NAME — Developer ID signing
      #   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID — notarize when signed
      # When unset, tag releases stay unsigned (identity=null, notarize=false).
      - name: Build macOS app
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          PUBLISH_TAG="${{ github.event.inputs.publish_to_tag }}"
          if [[ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" || -n "${PUBLISH_TAG// /}" ]]; then
            if [[ -n "${PUBLISH_TAG// /}" ]]; then
              echo "Manual publish to existing release tag: $PUBLISH_TAG"
            else
              echo "Tag release build: publishing to GitHub Releases (latest-mac.yml + DMG/ZIP)"
            fi
            npm run build:mac:publish
          else
            echo "Branch/manual build: package only (--publish never)"
            npm run build:mac
          fi

      - name: Verify macOS app artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(dist/BlinkGuard-*.dmg)
          zips=(dist/BlinkGuard-*.zip)
          if [[ ${#dmgs[@]} -eq 0 ]]; then
            echo "No DMG artifacts found"
            ls -la dist/ || true
            exit 1
          fi
          if [[ ${#zips[@]} -eq 0 ]]; then
            echo "No ZIP artifacts found"
            ls -la dist/ || true
            exit 1
          fi
          for f in "${dmgs[@]}" "${zips[@]}"; do
            size=$(stat -f%z "$f")
            echo "$f: $size bytes ($(( size / 1024 / 1024 )) MB)"
            if [[ "$size" -lt 80000000 ]]; then
              echo "Artifact seems too small (<80MB): $f"
              exit 1
            fi
          done
          PUBLISH_TAG="${{ github.event.inputs.publish_to_tag }}"
          if [[ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" || -n "${PUBLISH_TAG// /}" ]]; then
            if [[ ! -f dist/latest-mac.yml ]]; then
              echo "latest-mac.yml not found (required for electron-updater)"
              ls -la dist/ || true
              exit 1
            fi
            blockmaps=(dist/*.blockmap)
            if [[ ${#blockmaps[@]} -eq 0 ]]; then
              echo "No .blockmap files found (required for electron-updater)"
              ls -la dist/ || true
              exit 1
            fi
            echo "OK: updater metadata present (latest-mac.yml + blockmap)"
          fi
          echo "macOS app artifacts verification passed!"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v5
        with:
          name: BlinkGuard-macOS
          if-no-files-found: error
          path: |
            dist/BlinkGuard-*.dmg
            dist/BlinkGuard-*.zip

      - name: Upload macOS updater metadata
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_to_tag != ''
        uses: actions/upload-artifact@v5
        with:
          name: BlinkGuard-macOS-updater
          path: |
            dist/latest-mac.yml
            dist/*.blockmap
